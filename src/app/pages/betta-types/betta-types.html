<section class="page-banner">
  <div class="container">
    <div class="page-hero-grid">
      <div>
        <p class="eyebrow">Betta Categories</p>
        <h1>Betta Fish Categories</h1>
        <p class="lead">
          Choose a category to explore different betta fish types, colors, and
          styles in BettaHub.
        </p>
      </div>

      <div class="hero-media-placeholder">
        <img
          src="/logo.jpg"
          alt="Betta fish categories"
          style="width: 100%; height: 100%; object-fit: cover; border-radius: 28px;"
        />
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="category-grid">

      <button type="button" class="category-card" (click)="openBettaType('/betta-types/halfmoon')">
        <div class="category-image">
          <img src="/images/halfmoon-1.webp" alt="Halfmoon betta" />
        </div>
        <span class="category-name">Halfmoon</span>
      </button>

      <button type="button" class="category-card" (click)="openBettaType('/betta-types/koi')">

      </button>
