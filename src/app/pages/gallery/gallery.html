<section class="page-banner">
  <div class="container">
    <div class="page-hero-grid">
      <div>
        <p class="eyebrow">Betta Gallery</p>
        <h1>Betta Fish Gallery</h1>
        <p class="lead">
          Explore a colorful collection of betta fish varieties, patterns, and
          fin styles for inspiration and learning.
        </p>
      </div>

      <div class="hero-media-placeholder">
        <img
          src="/logo.jpg"
          alt="Betta fish gallery"
          style="width: 100%; height: 100%; object-fit: cover; border-radius: 28px;"
        />
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="gallery-toolbar">
      <p class="gallery-note">Click any image to view it larger.</p>
    </div>

    <div class="gallery-grid">
      @for (item of galleryItems; track item.src) {
        <button
  type="button"
  class="gallery-item"
  (click)="openPreview(item)"
  data-bs-toggle="modal"
  data-bs-target="#galleryPreviewModal"
>
          <img [src]="item.src" [alt]="item.alt" />
          <span class="gallery-caption">{{ item.title }}</span>
        </button>
      }
    </div>
  </div>
</section>

<div
  class="modal fade"
  id="galleryPreviewModal"
  tabindex="-1"
  aria-labelledby="galleryPreviewLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content gallery-modal">
      <div class="modal-header gallery-modal-header">
        <h5 class="modal-title" id="galleryPreviewLabel">
          {{ selectedItem?.title }}
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>

      <div class="modal-body gallery-modal-body">
        @if (selectedItem) {
          <img
            [src]="selectedItem.src"
            [alt]="selectedItem.alt"
            class="gallery-modal-image"
          />
        }
      </div>
    </div>
  </div>
</div>
