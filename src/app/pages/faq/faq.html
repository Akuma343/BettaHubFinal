<section class="page-banner">
  <div class="container">
    <div class="page-hero-grid">
      <div>
        <p class="eyebrow">Support</p>
        <h1>Frequently Asked Questions</h1>
        <p class="lead">
          Find quick answers to common questions about betta fish care,
          behavior, and setup.
        </p>
      </div>

      <div class="hero-media-placeholder">
        <img
          src="/images/homebg2.jpg"
          alt="FAQ"
          style="width: 100%; height: 100%; object-fit: cover; border-radius: 28px;"
        />
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">

    <div class="faq-wrapper">

      <!-- FAQ ITEM -->
      <div class="faq-item" *ngFor="let faq of faqs; let i = index">
        <button class="faq-question" (click)="toggle(i)">
          <span class="faq-icon">
            <i class="bi bi-question-circle"></i>
          </span>
          {{ faq.question }}
          <i class="bi" [ngClass]="faq.open ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
        </button>

        <div class="faq-answer" [class.open]="faq.open">
          <p>{{ faq.answer }}</p>
        </div>
      </div>

    </div>

  </div>
</section>
